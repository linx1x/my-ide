# Production override: no source mount, no watch, HEALTHCHECK.
# Run: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Or: docker compose --profile prod -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Requires: .env (or env) with DASHBOARD_SECRET and ALLOWED_NUMBERS.
# Persistent data: bridge-data volume (/data) holds .env, auth_store, auth DB, and workspaces.

services:
  bridge:
    build: .
    image: my-ide:latest
    stdin_open: true
    tty: true
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DOCKER=1
      - DOCKER_DATA_DIR=/data
      - DOTENV_CONFIG_PATH=/data/.env
      - DASHBOARD_ENABLED=1
    volumes:
      - bridge-data:/data
      - ./.env:/data/.env
    ports:
      - "${DASHBOARD_PORT:-3847}:${DASHBOARD_PORT:-3847}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${DASHBOARD_PORT:-3847}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: ["npx", "tsx", "src/index.ts"]

volumes:
  bridge-data:
