name: CI
on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run check:no-new-ts-nocheck
      - run: npm run check:ts-nocheck-budget
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
